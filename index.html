<head>

<title>UMAK Quiz Bee Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"><i></i></span><div><h1>UMAK Quiz Bee Reviewer</h1><small>14th IT Olympics</small></div></div>
    <div class="count" id="countdown" aria-live="polite"></div>
  </header>
  <nav class="tabs" aria-label="Sections">
    <a href="#review" data-tab="review"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg><span>Review</span></a>
    <a href="#quiz" data-tab="quiz"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg><span><span class="long">Multiple choice</span><span class="short">Quiz</span></span></a>
    <a href="#cards" data-tab="cards"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 3h14v12"/></svg><span><span class="long">Flashcards</span><span class="short">Cards</span></span></a>

  </nav>
  <main id="view"></main>
</div>
